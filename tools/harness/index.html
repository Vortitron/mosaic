<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic harness</title>
<style>body { margin: 0; background: #111; } .hdr { height: 56px; background: #03a9f4; } </style>
<div class="hdr"></div>
<mosaic-start></mosaic-start>
<script type="module">
// Stand-ins for Home Assistant's icon elements, drawing the same Material
// Design icons Home Assistant uses (picked by domain, state and class).
import * as mdi from '../../node_modules/@mdi/js/mdi.js';
const camel = (name) => 'mdi' + name.replace(/^mdi:/, '').split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join('');
function iconFor(st) {
  if (!st) return 'mdiHelpCircleOutline';
  const [d] = st.entity_id.split('.');
  const on = ['on', 'open', 'playing', 'home', 'heat', 'unlocked'].includes(st.state);
  const dc = st.attributes.device_class;
  const byClass = { temperature: 'mdiThermometer', humidity: 'mdiWaterPercent', power: 'mdiFlash', energy: 'mdiLightningBolt', carbon_dioxide: 'mdiMoleculeCo2', motion: on ? 'mdiMotionSensor' : 'mdiMotionSensorOff', window: on ? 'mdiWindowOpenVariant' : 'mdiWindowClosedVariant', door: on ? 'mdiDoorOpen' : 'mdiDoorClosed' };
  if (byClass[dc]) return byClass[dc];
  const byDomain = {
    light: on ? 'mdiLightbulb' : 'mdiLightbulbOutline', switch: on ? 'mdiToggleSwitch' : 'mdiToggleSwitchOffOutline', media_player: on ? 'mdiSpeakerPlay' : 'mdiSpeaker',
    camera: 'mdiCctv', lock: on ? 'mdiLockOpenVariant' : 'mdiLock', climate: 'mdiThermostat', person: on ? 'mdiAccount' : 'mdiAccountArrowRight', cover: 'mdiBlindsHorizontal',
    scene: 'mdiPalette', vacuum: 'mdiRobotVacuum', weather: 'mdiWeatherPartlyCloudy', sensor: 'mdiEye', binary_sensor: 'mdiCheckboxMarkedCircleOutline', calendar: 'mdiCalendar',
  };
  return byDomain[d] || 'mdiCircleOutline';
}
for (const tag of ['ha-icon', 'ha-state-icon']) customElements.define(tag, class extends HTMLElement {
  connectedCallback() { this.paint(); }
  set stateObj(s) { this._s = s; this.paint(); }
  set hass(h) {}
  paint() {
    const name = this.getAttribute('icon') ? camel(this.getAttribute('icon')) : iconFor(this._s);
    const path = mdi[name] || mdi.mdiCircleOutline;
    this.style.cssText = 'display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)';
    this.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="${path}"/></svg>`;
  }
});
import { makeFakeHass, FAKE_PLAN } from './fakehass.js';
await import('../../dist/mosaic.js');
const p = new URLSearchParams(location.search);
// ?bare: no stand-in Home Assistant header (README screenshots).
if (p.has('bare')) document.querySelector('.hdr').remove();
const card = document.querySelector('mosaic-start');
const conf = { accent: p.get('accent') || 'cobalt', theme: p.get('theme') || 'auto' };
if (p.has('cols')) conf.columns = Number(p.get('cols'));
if (p.has('plan')) conf.floorplan = FAKE_PLAN;
if (p.has('wall')) conf.wallpaper = p.get('wall') || '/tools/harness/art.svg';
card.setConfig(conf);
window.hass = makeFakeHass((h) => { card.hass = h; window.hass = h; }, { agent: p.get('agent') || 'anthropic' });
if (p.get('theme') === 'light') window.hass.themes.darkMode = false;
// ?big: a house the size of a real one (3,000 more entities on 180 devices).
if (p.has('big')) {
  const h = window.hass;
  for (let d = 0; d < 180; d++) {
    h.devices[`big${d}`] = { id: `big${d}`, name: `Gadget ${d}`, area_id: Object.keys(h.areas)[d % 7] };
    for (let e = 0; e < 17; e++) {
      const id = e === 0 ? `switch.gadget_${d}` : `sensor.gadget_${d}_${e}`;
      h.states[id] = { entity_id: id, state: e === 0 ? 'off' : String(e * d), attributes: { friendly_name: `Gadget ${d} reading ${e}`, unit_of_measurement: e ? 'W' : undefined } };
      h.entities[id] = { entity_id: id, device_id: `big${d}`, area_id: null, platform: 'demo' };
    }
  }
}
card.hass = window.hass;
window.card = card;
window.moreInfo = [];
card.addEventListener('hass-more-info', (e) => window.moreInfo.push(e.detail.entityId));
window.booted = true;
</script>

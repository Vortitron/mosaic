# Tests, and proof that the committed dist/mosaic.js is the build of this
# source. The Marketplace installs a release from its tag's files, so a tag
# with a stale bundle would ship old code to everyone.
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: dist/ matches the source
        run: git diff --exit-code -- dist/ || (echo "::error::dist/mosaic.js is not the build of this commit; run npm run build and commit it" && exit 1)

# HACS's own repository check: what the default list (and Home Assistant's
# Marketplace, which installs from it from 2026.11) asks a dashboard card for.
name: Validate

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
